name: Android stages 1-2 debug checks
on:
  pull_request:
    paths: ['android-client/**', 'app/api/client.py', 'app/services/mobile_auth.py', '.github/workflows/android.yml']
  push:
    branches: ['android-stage-1-2-foundation-ai-chat']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:dependencies :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
  device:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          working-directory: android-client
          script: chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest
# Debug validation only. No release task or artifact publication.
