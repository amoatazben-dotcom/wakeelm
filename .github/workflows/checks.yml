name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agent:local-test-only@localhost:5432/agent
      TEST_DATABASE_URL: postgresql://agent:local-test-only@localhost:5432/agent
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --frozen
      - run: uv run --frozen ruff check app tests alembic
      - run: uv run --frozen ruff format --check app tests alembic
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen alembic check
      - run: docker build -f docker/validation.Dockerfile -t wakeelm-validation:ci .
      - run: uv run --frozen pytest -q
        env:
          TEST_SANDBOX_IMAGE: wakeelm-validation:ci
