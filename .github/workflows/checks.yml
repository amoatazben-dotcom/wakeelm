name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agent:local-test-only@localhost:5432/agent
      TEST_DATABASE_URL: postgresql://agent:local-test-only@localhost:5432/agent
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --extra dev --frozen
      - run: uv run --frozen ruff check app tests alembic scripts
      - run: uv run --frozen ruff format --check app tests alembic scripts
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen alembic check
      - run: docker build -f docker/validation.Dockerfile -t wakeelm-validation:ci .
      - run: uv run --frozen pytest -q
        env:
          TEST_SANDBOX_IMAGE: wakeelm-validation:ci
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: uvx --from pip-audit==2.10.1 pip-audit -r requirements.txt --no-deps --disable-pip
      - run: uvx --from bandit==1.9.4 bandit -r app scripts -ll
      - name: Scan working tree and full Git history
        run: sh scripts/scan_secrets.sh
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --build-arg BUILD_GIT_SHA=${{ github.sha }} -t wakeelm-candidate:ci .
      - run: sh scripts/scan_container.sh wakeelm-candidate:ci container-audit.json
